name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: '3000'
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://localhost:3000
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_USER: test
      SMTP_PASSWORD: test
      MAIL_FROM: auth@example.com
      REDIS_URL: redis://127.0.0.1:6379/1
      NOTIFICATION_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      # Credentials belong only to this disposable CI service.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/url_shortener_test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d url_shortener_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Type-check application and tests
        run: npm run test:types
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Apply test database migrations
        run: npm run migration:run
      - name: API tests
        run: npm run test:e2e

  container:
    name: Container acceptance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create isolated container settings
        run: node scripts/setup-docker-env.mjs --ci
      - name: Build image, migrate and start local services
        run: npm run docker:up
      - name: Container acceptance test
        run: npm run docker:smoke
      - name: Stop local services
        if: always()
        run: npm run docker:down
